name: TLC Battle CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/tlc-battle-atomic-overhaul]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Physics regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Browser smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tlc-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tlc-preview.log
          exit 1
      - name: Real-browser Fold and desktop startup
        run: node scripts/browser-smoke.mjs
