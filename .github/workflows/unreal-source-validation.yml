name: Unreal Source & Manifest Validation
on:
  push:
    branches: [main, unreal-production-rebuild]
    paths: ["unreal/**", ".github/workflows/unreal-source-validation.yml"]
  pull_request:
    paths: ["unreal/**", ".github/workflows/unreal-source-validation.yml"]
permissions:
  contents: read
jobs:
  source-policy:
    name: Source and manifest policy only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate source/manifests
        run: python3 unreal/scripts/validate_project.py
      - name: Explicit scope notice
        run: echo "This job does not compile Unreal, run UHT, execute Unreal Automation, cook, package, or sign binaries."
