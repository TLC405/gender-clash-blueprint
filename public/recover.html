<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071424"><title>TLC Battlecast • Repair Launch</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#071424;color:#f0f6ff;display:grid;place-items:center;padding:22px}
main{width:min(460px,100%);padding:30px 24px;border:1px solid #667b95;border-radius:14px;background:#14253a;box-shadow:0 20px 60px #0007}
.logo{font:italic 1000 clamp(60px,16vw,96px) Arial Black,system-ui,sans-serif;letter-spacing:-5px;color:#f8f9ff;text-shadow:5px 6px 0 #df7529}
.small{font:800 11px system-ui;letter-spacing:2.2px;color:#82c8ef;text-transform:uppercase}
h1{font-size:27px;letter-spacing:-.7px;line-height:1.12;margin:23px 0 10px}
p{color:#b8cbdd;font-size:14px;line-height:1.6}
button,a{display:block;width:100%;border:1px solid #d88352;border-radius:6px;background:#d8793f;color:#071424;padding:16px 12px;font:900 15px system-ui;text-align:center;text-decoration:none;margin-top:15px;cursor:pointer}
a{background:#172e48;color:#e5f1fe;border-color:#718aa7}
#status{min-height:42px;margin-top:16px;color:#8de3c1;font-size:13px;line-height:1.5}
</style></head><body><main>
<div class="small">Atomic Edition / Maintenance</div><div class="logo">TLC</div>
<h1>Repair and open the game</h1>
<p>This removes the older app's broken offline cache, not your game preferences. It then launches a fresh version.</p>
<button id="repair">REPAIR &amp; OPEN GAME</button>
<a href="/?safe=1&recovery=manual">OPEN LIGHTWEIGHT MODE</a>
<div id="status" role="status" aria-live="polite">Ready to repair.</div>
</main><script>
(function(){
var button=document.getElementById('repair'), status=document.getElementById('status');
button.onclick=async function(){
button.disabled=true;status.textContent='Clearing older game files…';
try{
 if('serviceWorker' in navigator){
  var regs=await navigator.serviceWorker.getRegistrations();
  await Promise.all(regs.filter(function(r){return r.scope.indexOf(location.origin)===0}).map(function(r){return r.unregister()}));
 }
 if('caches' in window){
  var keys=await caches.keys();
  await Promise.all(keys.filter(function(k){return k.indexOf('tlc-battle-')===0}).map(function(k){return caches.delete(k)}));
 }
 status.textContent='Old cache cleared. Launching the game…';
}catch(e){status.textContent='Cache cleanup was limited. Trying a fresh launch…';}
location.replace('/?safe=1&repair='+Date.now());
}
})();
</script></body></html>
