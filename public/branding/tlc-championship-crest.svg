<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">TLC Battlecast Championship Crest</title>
<desc id="desc">Original metallic TLC lettering above a faceted midnight-blue championship crest, Oklahoma City skyline and amber lightning accents. An independent logo inspired by professional sports energy.</desc>
<defs>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f4ff"/><stop offset=".22" stop-color="#689cce"/><stop offset=".47" stop-color="#f5f9ff"/><stop offset=".75" stop-color="#546f95"/><stop offset="1" stop-color="#fcffff"/></linearGradient>
 <linearGradient id="blue" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#1265ba"/><stop offset=".42" stop-color="#072b65"/><stop offset="1" stop-color="#040f2c"/></linearGradient>
 <linearGradient id="metal" x1=".04" y1="0" x2=".3" y2="1"><stop stop-color="#ffffff"/><stop offset=".40" stop-color="#d6e7f7"/><stop offset=".66" stop-color="#879bb8"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffe29b"/><stop offset=".38" stop-color="#ff8c2a"/><stop offset=".72" stop-color="#ef5a20"/><stop offset="1" stop-color="#843313"/></linearGradient>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062453"/><stop offset=".6" stop-color="#051228"/><stop offset="1" stop-color="#010712"/></linearGradient>
 <filter id="lift" x="-20%" y="-20%" width="150%" height="155%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020912" flood-opacity=".55"/></filter>
 <filter id="inner" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#00102c" flood-opacity=".75"/></filter>
 <pattern id="hex" patternUnits="userSpaceOnUse" width="24" height="22"><path d="M6 1L18 1L23 11L18 21L6 21L1 11Z" fill="none" stroke="#8abde2" stroke-opacity=".11" stroke-width="1"/></pattern>
</defs>
<!-- original faceted championship badge, not any NBA shield -->
<g filter="url(#lift)">
