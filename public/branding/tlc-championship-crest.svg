 <path d="M600 108 840 175 998 305 951 510 752 651 600 707 448 651 249 510 202 305 360 175Z" fill="url(#hex)"/>
 <!-- bold angular orange/blue velocity wings -->
 <path d="M225 318 65 281 136 358 17 416 259 401 295 341Z" fill="url(#orange)" stroke="#fdf4df" stroke-width="6" stroke-linejoin="round"/>
 <path d="M975 318 1135 281 1064 358 1183 416 941 401 905 341Z" fill="url(#orange)" stroke="#fdf4df" stroke-width="6" stroke-linejoin="round"/>
 <path d="M219 385 70 455 273 433 332 389Z" fill="#0e78bd" stroke="#d9eaff" stroke-width="4"/>
 <path d="M981 385 1130 455 927 433 868 389Z" fill="#0e78bd" stroke="#d9eaff" stroke-width="4"/>
 <!-- unique skyline silhouette inspired by OKC architecture -->
 <path d="M368 300V226H412V262H442V206H476V230H506V182H534V151L553 131 572 151V280H590V205H625V227H650V162H669V138L690 109 711 138V247H744V224H786V256H817V198H845V300Z" fill="#0a3d78" stroke="#75bdff" stroke-width="5" stroke-linejoin="round"/>
 <path d="M535 153 553 131 572 153M690 110V284M442 206V282M650 162V279" fill="none" stroke="#f9c16d" stroke-width="6"/>
 <path d="M386 240v27m15-27v27m60-43v25m59-48v26m168-35v30m14-30v30m115-17v26" stroke="#abd9f6" stroke-width="5"/>
 <!-- high contrast championship logotype -->
 <path d="M143 330 1058 330 1004 557 226 557Z" fill="#000a23" stroke="#144b8d" stroke-width="16" stroke-linejoin="round"/>
 <path d="M170 338 1030 338 987 543 246 543Z" fill="url(#blue)" stroke="#ff9b36" stroke-width="6"/>
 <text x="610" y="520" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-style="italic" font-weight="1000" letter-spacing="-11" font-size="266" stroke="#00102e" stroke-width="24" paint-order="stroke fill" fill="url(#metal)" filter="url(#inner)">TLC</text>
 <path d="M258 546 951 546 912 580 290 580Z" fill="url(#orange)" stroke="#e5f1ff" stroke-width="4"/>
 <path d="M600 585 563 647 601 626 570 713 656 606 610 618 638 583Z" fill="url(#orange)" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
